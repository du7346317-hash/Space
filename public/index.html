<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Neon</title>
  <style>
    body {
      background-color: #0F172A;
      color: #F8FAFC;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .join-panel {
      background-color: #1E293B;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
    }
    .input-field {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      background: #0F172A;
      border: 1px solid #334155;
      color: white;
      border-radius: 6px;
    }
    .btn {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      background-color: #10B981;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .btn:disabled { background-color: #555; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="join-panel">
    <h3>Painel Inicial</h3>
    <input type="text" id="invite-link" class="input-field" placeholder="Cole o link do servidor aqui...">
    <div>
      <button class="btn">Criar Servidor</button>
      <button class="btn" id="btn-enter" disabled>Entrar</button>
    </div>
  </div>

  <!-- Puxando o client do WebSocket direto do provedor -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const socket = io();
    const input = document.getElementById('invite-link');
    const btnEnter = document.getElementById('btn-enter');

    input.addEventListener('input', () => {
      btnEnter.disabled = input.value.trim() === '';
    });
  </script>
</body>
</html>
