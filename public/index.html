<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space</title>
    <style>
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-sidebar: #1e1f22;
            --bg-chat: #313338;
            --accent: #5865f2;
            --danger: #ed4245;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --hover-color: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* LAYOUT GERAL */
        .servers-nav {
            width: 72px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
        }

        .server-bubble {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .server-bubble:hover, .server-bubble.active {
            border-radius: 16px;
            background-color: var(--accent);
        }

        .sidebar {
            width: 240px;
            background-color: var(--bg-secondary);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px;
            font-weight: bold;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-item {
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            margin-bottom: 2px;
            display: flex;
            align-items: center;
        }

        .channel-item:hover, .channel-item.active {
            background-color: var(--hover-color);
            color: var(--text-main);
        }

        .category-label {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            margin: 12px 0 4px 8px;
            letter-spacing: 0.5px;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
        }

        .chat-header {
            height: 48px;
            padding: 0 16px;
            border-bottom: 1px solid rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message-item {
            display: flex;
            gap: 16px;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            flex-shrink: 0;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message-header {
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .message-author {
            font-weight: 600;
            color: #fff;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .message-text {
            color: var(--text-main);
            word-break: break-word;
        }

        .chat-input-area {
            padding: 0 16px 24px 16px;
        }

        .chat-input-wrapper {
            background-color: #383a40;
            border-radius: 8px;
            display: flex;
            padding: 10px 16px;
        }

        .chat-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            font-size: 15px;
        }

        /* TELAS DE AUTH (LOGIN / REGISTRO) */
        .auth-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .auth-box {
            background-color: var(--bg-secondary);
            padding: 32px;
            border-radius: 8px;
            width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .input-group input {
            background-color: var(--bg-sidebar);
            border: 1px solid transparent;
            border-radius: 4px;
            padding: 10px;
            color: #fff;
            outline: none;
        }

        .btn {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .user-panel-footer {
            margin-top: auto;
            background-color: #232428;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div class="auth-container" id="authScreen">
        <div class="auth-box">
            <h2 style="color: #fff; text-align: center;">Bem-vindo de volta!</h2>
            <div class="input-group">
                <label>E-mail</label>
                <input type="email" id="authEmail" placeholder="seu@email.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="authPassword" placeholder="Sua senha">
            </div>
            <button class="btn" onclick="handleLogin()">Entrar</button>
            <button class="btn" style="background: transparent; color: var(--accent); border: 1px solid var(--accent);" onclick="handleRegister()">Registrar Conta</button>
        </div>
    </div>

    <!-- APLICAÇÃO PRINCIPAL -->
    <!-- BARRA LATERAL DE SERVIDORES -->
    <div class="servers-nav" id="serversNav">
        <div class="server-bubble active" onclick="goHome()" title="Início / Amigos">⚡</div>
        <div style="width: 32px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 1px;"></div>
        <!-- Servidores injetados via JS -->
    </div>

    <!-- BARRA LATERAL DE CANAIS / AMIGOS -->
    <div class="sidebar">
        <div class="sidebar-header" id="sidebarHeaderTitle">
            <span>Amigos & Directs</span>
        </div>
        <div class="sidebar-content" id="sidebarSecondary">
            <!-- Conteúdo dinâmico preenchido pelo goHome() -->
        </div>
        
        <!-- RODAPÉ DO USUÁRIO LOGADO -->
        <div class="user-panel-footer" id="userFooter">
            <div id="footerAvatar" style="width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display:flex; align-items:center; justify-content:center; font-weight:bold; color:#fff; overflow:hidden;">U</div>
            <div style="flex: 1; overflow: hidden;">
                <div id="footerUsername" style="font-size: 13px; font-weight: bold; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Usuário</div>
                <div style="font-size: 11px; color: var(--text-muted);">Online</div>
            </div>
            <button onclick="openProfileSettings()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;" title="Configurar Perfil">⚙️</button>
        </div>
    </div>

    <!-- ÁREA PRINCIPAL DO CHAT -->
    <div class="chat-area">
        <div class="chat-header" id="mainHeader">
            <span>Painel de Amigos</span>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                <h3>Selecione um amigo ou canal para começar a conversar!</h3>
            </div>
        </div>
        <div class="chat-input-area" id="chatInputArea" style="display: none;">
            <div class="chat-input-wrapper">
                <input type="text" class="chat-input" id="messageInput" placeholder="Enviar mensagem..." onkeypress="checkSend(event)">
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES DE PERFIL -->
    <div class="modal-overlay" id="profileModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 3000;">
        <div class="modal-box" style="background: var(--bg-secondary); padding: 20px; border-radius: 8px; width: 350px; text-align: center;">
            <h3 style="margin-bottom: 15px; color: var(--text-main);">Editar Perfil</h3>
            <div class="image-picker" onclick="document.getElementById('profileImageInput').click()" style="cursor: pointer; margin-bottom: 15px;">
                <div class="preview-box" id="profileImagePreview" style="width: 80px; height: 80px; border-radius: 50%; background: var(--accent); margin: 0 auto 8px auto; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; color: #fff;">📷</div>
                <span style="font-size: 12px; color: var(--accent);">Alterar foto de perfil</span>
                <input type="file" id="profileImageInput" accept="image/*" style="display: none;" onchange="previewProfileImage(event)">
            </div>
            <div class="input-group" style="text-align: left; margin-bottom: 15px;">
                <label style="font-size: 12px; color: var(--text-muted);">Novo Nome de Usuário</label>
                <input type="text" id="editUsernameInput" placeholder="Seu novo nick" style="width: 100%; padding: 8px; border-radius: 4px; border: none; background: var(--bg-primary); color: #fff; margin-top: 4px; outline:none;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn btn-secondary" style="flex:1; padding: 8px; border-radius: 4px; border: none; cursor: pointer; background: #4e5058; color:#fff;" onclick="closeProfileSettings()">Cancelar</button>
                <button class="btn" style="flex:1; padding: 8px; border-radius: 4px; border: none; background: var(--accent); color: #fff; cursor: pointer;" onclick="saveProfileChanges()">Salvar</button>
            </div>
        </div>
    </div>

    <!-- SOCKET.IO CLIENT -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentActiveServer = null;
        let currentTextChannel = null;
        let friendsData = { friends: [], friendRequests: [] };
        let unreadMessages = {};

        async function handleLogin() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const res = await fetch('/api/users/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                document.getElementById('authScreen').style.display = 'none';
                updateUserUI();
                goHome();
            } else {
                alert(data.error);
            }
        }

        async function handleRegister() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const username = prompt("Escolha seu nome de usuário:");
            if (!username) return;

            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                handleLogin();
            } else {
                alert(data.error);
            }
        }

        function updateUserUI() {
            document.getElementById('footerUsername').textContent = currentUser.username;
            const footerAvatar = document.getElementById('footerAvatar');
            if (currentUser.avatar) {
                footerAvatar.innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
            } else {
                footerAvatar.textContent = currentUser.username.charAt(0).toUpperCase();
            }
        }

        async function fetchFriendsData() {
            // Mock de dados locais de amizade caso precise ser integrado à API completa do seu app
            friendsData = currentUser.friendsData || { friends: [], friendRequests: [] };
        }

        async function goHome() {
            currentActiveServer = null;
            currentTextChannel = null;
            await fetchFriendsData();

            document.getElementById('sidebarHeaderTitle').innerHTML = `<span>Amigos & Directs</span>`;
            document.getElementById('mainHeader').innerHTML = `<span>Painel de Amigos</span>`;
            document.getElementById('chatInputArea').style.display = 'none';
            
            updateHomeUnreadBadge();

            let dmSidebar = `<div class="channel-item active" onclick="goHome()">👥 Lista de Amigos</div>`;
            dmSidebar += `<div class="category-label">MENSAGENS DIRETAS</div>`;
            
            // Renderiza lista de amigos dinamicamente com avatares reais
            if(currentUser.friends && currentUser.friends.length > 0) {
                currentUser.friends.forEach(f => {
                    const avatarHtml = f.avatar 
                        ? `<img src="${f.avatar}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;">` 
                        : `<div style="width:24px;height:24px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;">${f.username.charAt(0).toUpperCase()}</div>`;
                    
                    const convId = [currentUser.id, f.id].sort().join('-DM-');
                    const unreadCount = unreadMessages[convId] || 0;
                    const badge = unreadCount > 0 ? `<span style="background:var(--danger);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:bold;margin-left:auto;">${unreadCount}</span>` : '';

                    dmSidebar += `
                        <div class="channel-item" onclick="openDirectMessage('${f.id}', '${f.username}', '${f.avatar}')">
                            <div style="display:flex; align-items:center; gap:8px; flex:1; overflow:hidden;">
                                ${avatarHtml} 
                                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f.username}</span>
                            </div>
                            ${badge}
                        </div>
                    `;
                });
            }
            document.getElementById('sidebarSecondary').innerHTML = dmSidebar;
            
            document.getElementById('chatMessages').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted);">
                    <h3>Painel Inicial - Selecione uma conversa ou servidor</h3>
                </div>
            `;
        }

        async function getInviteLink() {
            if (!currentActiveServer) return;
            const res = await fetch(`/api/servers/${currentActiveServer.id}/invite`);
            const data = await res.json();
            if (res.ok) {
                navigator.clipboard.writeText(data.inviteLink);
                alert(`Link de convite (${data.inviteLink}) copiado para a área de transferência!`);
            } else {
                alert("Erro ao gerar link de convite.");
            }
        }

        // Funções de Perfil
        let selectedProfileImage = null;

        function openProfileSettings() {
            document.getElementById('editUsernameInput').value = currentUser.username;
            document.getElementById('profileModal').style.display = 'flex';
            if (currentUser.avatar) {
                document.getElementById('profileImagePreview').innerHTML = `<img src="${currentUser.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
                selectedProfileImage = currentUser.avatar;
            } else {
                document.getElementById('profileImagePreview').innerHTML = '📷';
                selectedProfileImage = null;
            }
        }

        function closeProfileSettings() {
            document.getElementById('profileModal').style.display = 'none';
            selectedProfileImage = null;
        }

        function previewProfileImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedProfileImage = e.target.result;
                    document.getElementById('profileImagePreview').innerHTML = `<img src="${selectedProfileImage}" style="width:100%;height:100%;object-fit:cover;">`;
                }
                reader.readAsDataURL(file);
            }
        }

        async function saveProfileChanges() {
            const newUsername = document.getElementById('editUsernameInput').value.trim();
            if (!newUsername) return alert('O nome de usuário não pode ficar vazio!');

            const res = await fetch('/api/users/profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, username: newUsername, avatar: selectedProfileImage })
            });
            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                updateUserUI();
                closeProfileSettings();
                alert(data.message);
                goHome();
            } else {
                alert(data.error);
            }
        }

        function openDirectMessage(friendId, friendUsername, friendAvatar) {
            const conversationId = [currentUser.id, friendId].sort().join('-DM-');
            currentTextChannel = conversationId;
            
            unreadMessages[conversationId] = 0;
            updateHomeUnreadBadge();

            socket.emit('join-text', currentTextChannel);
            
            document.getElementById('mainHeader').innerHTML = `<span>💬 ${friendUsername}</span>`;
            document.getElementById('chatInputArea').style.display = 'block';
            document.getElementById('chatMessages').innerHTML = '';
        }

        function checkSend(event) {
            if (event.key === 'Enter') {
                const input = document.getElementById('messageInput');
                const text = input.value.trim();
                if (!text || !currentTextChannel) return;

                socket.emit('send-message', {
                    channelId: currentTextChannel,
                    text: text,
                    user: { id: currentUser.id, username: currentUser.username, avatar: currentUser.avatar }
                });
                input.value = '';
            }
        }

        socket.on('receive-message', (data) => {
            if (currentTextChannel !== data.channelId) {
                unreadMessages[data.channelId] = (unreadMessages[data.channelId] || 0) + 1;
                updateHomeUnreadBadge();
            }

            if (currentTextChannel === data.channelId) {
                const msgsBox = document.getElementById('chatMessages');
                if(!msgsBox) return;

                const div = document.createElement('div');
                div.className = 'message-item';
                const avatarContent = data.user.avatar 
                    ? `<img src="${data.user.avatar}" style="width:100%;height:100%;object-fit:cover;">` 
                    : data.user.username.charAt(0).toUpperCase();
                
                div.innerHTML = `
                    <div class="message-avatar" style="overflow:hidden;">${avatarContent}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-author">${data.user.username}</span>
                            <span class="message-time">${data.time || 'Agora'}</span>
                        </div>
                        <div class="message-text">${data.text}</div>
                    </div>
                `;
                msgsBox.appendChild(div);
                msgsBox.scrollTop = msgsBox.scrollHeight;
            }
        });

        socket.on('load-history', (history) => {
            const msgsBox = document.getElementById('chatMessages');
            if(!msgsBox) return;
            
            msgsBox.innerHTML = '';
            history.forEach(data => {
                const div = document.createElement('div');
                div.className = 'message-item';
                const avatarContent = data.user.avatar 
                    ? `<img src="${data.user.avatar}" style="width:100%;height:100%;object-fit:cover;">` 
                    : data.user.username.charAt(0).toUpperCase();
                
                div.innerHTML = `
                    <div class="message-avatar" style="overflow:hidden;">${avatarContent}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-author">${data.user.username}</span>
                            <span class="message-time">${data.time}</span>
                        </div>
                        <div class="message-text">${data.text}</div>
                    </div>
                `;
                msgsBox.appendChild(div);
            });
            msgsBox.scrollTop = msgsBox.scrollHeight;
        });

        function updateHomeUnreadBadge() {
            const totalUnread = Object.values(unreadMessages).reduce((a, b) => a + b, 0);
            const homeBubble = document.querySelector('.servers-nav .server-bubble'); 
            if(!homeBubble) return;

            let badge = homeBubble.querySelector('.notification-badge');
            if (totalUnread > 0) {
                if (!badge) {
                    badge = document.createElement('span');
                    badge.className = 'notification-badge';
                    badge.style.cssText = 'position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff; border-radius:10px; padding:2px 6px; font-size:10px; font-weight:bold; border:2px solid var(--bg-sidebar);';
                    homeBubble.style.position = 'relative';
                    homeBubble.appendChild(badge);
                }
                badge.textContent = totalUnread;
            } else if (badge) {
                badge.remove();
            }
        }
    </script>
</body>
</html>
