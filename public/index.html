<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>SpaceX</title>
  <style>
    body { background-color: #0B1320; color: #FFF; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-box { background-color: #1E293B; padding: 35px 30px; border-radius: 12px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); text-align: center; }
    .input-box { width: 100%; padding: 12px; margin-bottom: 15px; background-color: #0F172A; border: 1px solid #334155; color: #FFF; border-radius: 6px; box-sizing: border-box; outline: none; }
    .input-box:focus { border-color: #10B981; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; background-color: #10B981; color: white; transition: 0.2s; }
    .btn:hover { background-color: #059669; }
    .subtext { font-size: 13px; color: #94A3B8; margin-top: 15px; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2 style="margin-top: 0;">Entrar na Conta</h2>
    <input type="email" id="email" class="input-box" placeholder="E-mail">
    <input type="password" id="password" class="input-box" placeholder="Senha">
    <button class="btn" onclick="fazerLogin()">Fazer Login</button>
    <p class="subtext">Não tem conta? O cadastro exigirá verificação no e-mail.</p>
  </div>

  <script>
    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      
      const data = await response.json();
      if(data.success) {
        window.location.href = data.redirect; // Manda pro painel de colar convite!
      } else {
        alert('Erro: ' + data.message);
      }
    }
  </script>
</body>
</html>
